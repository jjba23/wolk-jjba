name: CI

# Every push to trunk, every pull request, and on demand.  A branch used to
# be tested only after it was merged, which made "does this pass?" a question
# answered by the merge rather than by the pull request.
on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  byggsteg:
    name: 🧱 Byggsteg
    uses: jjba23/byggsteg-github/.github/workflows/byggsteg.yml@trunk
    with:
      tasks: maak-test
      timeout-minutes: 60
    secrets: inherit
