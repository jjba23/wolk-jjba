apiVersion: 1

# Alert rules for the Shepherd daemons.
#
# Loki rules use the same `job="host"` file streams as the logs
# dashboard.  The "log stream missing" rules use Alloy's per-file counter
# (loki_source_file_file_bytes_total) and are gated on Alloy itself being
# up, so a restart of Alloy does not produce a burst of false alarms; a
# separate rule covers monitoring targets going down.
#
# `noDataState: OK` is deliberate: an error query that finds nothing
# returns no series, which must mean "all good", not "no data".
#
# The restart-loop rule is the relaxed early warning of the group: it
# counts start-up banners rather than crash markers, so it also catches a
# daemon that dies before it can log an error, and it fires at a warning
# only after four restarts in an hour -- one restart is what a
# reconfigure looks like.

groups:
  - orgId: 1
    name: herd-daemons
    folder: wolk-jjba
    interval: 1m
    rules:
      - uid: herd-daemon-crash-markers
        title: Herd daemon crash markers
        condition: B
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum by (service) (count_over_time({job="host", service=~".+-daemon|icecast|minecraft"} |~ "(?i)\\b(backtrace|core dumped|segmentation fault|unhandled exception|panicked at|fatal error)\\b" [5m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "Crash markers in {{ $labels.service }}"
          description: "{{ $labels.service }} logged crash-like output (backtrace, panic, core dump or segmentation fault) in the last five minutes."

      - uid: herd-daemon-errors
        title: Herd daemon repeated errors
        condition: B
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum by (service) (count_over_time({job="host", service=~".+-daemon|icecast|minecraft"} |~ "(?i)\\b(error|fatal|panic|critical|failed|failure)\\b" [10m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 5
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Repeated errors in {{ $labels.service }}"
          description: "{{ $labels.service }} logged more than five error-like lines in ten minutes."

      - uid: herd-daemon-restart-loop
        title: Herd daemon restarting repeatedly
        condition: B
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum by (service) (count_over_time({job="host", service=~".+-daemon|icecast|minecraft|grafana|prometheus|loki|alloy|tempo"} |~ "(?i)(starting|started|listening on|ready to serve|serving on)" [1h]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 3
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} has restarted more than three times in an hour"
          description: "Start-up lines from {{ $labels.service }} appeared more than three times in the last hour, so the Shepherd is probably respawning it in a crash loop. This is a relaxed warning: a single restart is what a reconfigure looks like. Check `sudo herd status {{ $labels.service }}` and the tail of /var/log/wolk-jjba/{{ $labels.service }}.log."

      - uid: herd-monitoring-target-down
        title: Monitoring target down
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'up{job=~"prometheus|loki|alloy|tempo|node"}'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Monitoring target {{ $labels.job }} is down"
          description: "Prometheus has failed to scrape {{ $labels.job }} ({{ $labels.instance }}) for five minutes."

      - uid: herd-log-stream-missing-byggsteg
        title: "Log stream missing: byggsteg-daemon"
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'absent(loki_source_file_file_bytes_total{path="/var/log/wolk-jjba/byggsteg-daemon.log"}) and on() (up{job="alloy"} == 1)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: critical
          daemon: byggsteg-daemon
        annotations:
          summary: "Alloy is not tailing byggsteg-daemon's log"
          description: "The file /var/log/wolk-jjba/byggsteg-daemon.log is not among Alloy's tailed files. The file was deleted, became unreadable, or the daemon stopped writing to it."

