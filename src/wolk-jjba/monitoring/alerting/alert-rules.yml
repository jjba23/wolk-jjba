        noDataState: OK
        execErrState: Error
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "verify-backups has not succeeded in a week"
          description: "The weekly job that decrypts the newest archive of every project and reads it back has not reported a success for more than eight days. Either it is failing -- `sudo herd status verify-backups` and /var/log/wolk-jjba/verify-backups.log will say which project and why -- or it is no longer scheduled."

      - uid: disk-report-stale
