        annotations:
          summary: "The hourly disk report has not run for two hours"
          description: "disk-report writes /var/lib/prometheus/node-exporter/wolk_disk.prom every hour. It is missing or old, so the backup age metrics (and the alerts built on them) prove nothing right now. Check `sudo herd status disk-report`, the tail of /var/log/wolk-jjba/disk-report.log, and whether node exporter is pointed at the same textfile directory (`curl -s 127.0.0.1:9100/metrics | grep wolk_`)."

      - uid: gfs-backup-stale
        title: Long-term retention has not run
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
