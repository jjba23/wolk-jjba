  # Disk pressure and backup freshness.
  #
  # The node_filesystem_* series come from the node exporter; the wolk_*
  # series are written by the Shepherd jobs in (wolk-jjba maintenance)
  # into the exporter's textfile directory.  Two properties of the
  # wolk_* metrics matter for these rules:
  #
  #   - `wolk_backup_newest_timestamp_seconds' is 0 for a project that
  #     has no archive at all, so "there is no backup" is caught by the
  #     same rule as "the backup is old" -- `time() - 0' is enormous.
  #   - `wolk_disk_report_timestamp_seconds' is the canary for the
  #     reporting itself: if it stops advancing, either the disk-report
  #     job is not running or node exporter is not reading its textfile
  #     directory, and every other wolk_* rule would be silently
  #     "no data" instead of firing.
  #
  # Backups are made twice a day, so 26 hours is one missed run plus an
  # hour of slack.  `noDataState: OK' is kept for the same reason as in
  # the daemon group: a query that matches nothing means "nothing wrong
  # to report", and the report-stale rule covers the case where the
  # metrics are missing for a reason.
  - orgId: 1
    name: disk-and-backups
    folder: wolk-jjba
    interval: 1m
    rules:
      - uid: disk-space-low
        title: Disk space low
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: '100 * (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|devtmpfs|squashfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|devtmpfs|squashfs|overlay"})'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 85
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Root filesystem is more than 85% full"
          description: "{{ $value }}% of / is in use. The scheduled cleanups (guix-gc, podman-prune, cache-clean, tmp-clean) reclaim space on a schedule, so a steady climb means something is growing faster than they clean: check `sudo du -sh /gnu/store /var/lib/* /wolk-jjba-backups` and the Disk hygiene section of the README."

      - uid: disk-space-critical
        title: Disk space critically low
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: '100 * (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|devtmpfs|squashfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|devtmpfs|squashfs|overlay"})'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 93
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Root filesystem is more than 93% full"
          description: "{{ $value }}% of / is in use. At this level a backup can fail half-way (a partially written archive is discarded, so nothing is corrupted, but the night's backup is lost) and PostgreSQL may refuse writes. Free space now: `sudo herd trigger guix-gc`, then `sudo guix gc`, and check `df -h /`."

      - uid: disk-fill-forecast
        title: Disk will fill within a day
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 21600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'predict_linear(node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|devtmpfs|squashfs|overlay"}[6h], 24 * 3600)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Free space is projected to run out within 24 hours"
          description: "Linear extrapolation of the last six hours of free space reaches zero within a day. A fill rate like that is a runaway log, a builder cache or a backup loop, not growth: look at `sudo du -sh /gnu/store /var/lib/*` and the disk_* series on this dashboard."

      - uid: backup-stale
        title: Backup is stale
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "time() - max by (project) (wolk_backup_newest_timestamp_seconds)"
              instant: true
              intervalMs: 1000
