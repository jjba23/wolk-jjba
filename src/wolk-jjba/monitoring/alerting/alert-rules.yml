          description: "wolk-jjba-backups/archive/{{ $labels.project }} on the Storage Box is empty, so the only copies of this project's data are the handful of archives the hourly mirror keeps (three days at most). The nightly promotion should have created one; see the `Long-term retention has not run` alert and /var/log/wolk-jjba/gfs-backup.log."

  # The radio: Icecast, the sources MPD pushes into it, and the library
  # the stream is read from.
  #
  # The rules are split by what a human would have to do about them.
  # `radio-icecast-down`, `radio-source-missing` and `radio-mpd-down` are
  # the ones the five-minute `radio-health` job also tries to repair by
  # restarting the daemons, so the alert means "the automatic repair did
  # not work".  MPD is only restarted when it is down or was playing:
  # bouncing a paused player would put the music back on, which is the
  # one thing the job must never do.  `radio-library-unmounted` is
  # deliberately *not* something the job restarts anything for: with the
  # Storage Box unreachable a restart cannot help, and the stream comes
  # back by itself once the mount does.  `radio-silent` is the one that
  # says "nobody is listening to anything" -- a pause left on, or a
  # player that stopped -- and it is a warning, not a repair.
  #
  # `radio-metrics-stale` is the canary, like `disk-report-stale`: if the
  # radio-health job stops writing its textfile, everything else here
  # would sit in "no data" instead of firing.
  - orgId: 1
    name: radio
    folder: wolk-jjba
    interval: 1m
    rules:
      - uid: radio-icecast-down
        title: Icecast is not answering
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "wolk_radio_up"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Icecast is not answering on 6690"
          description: "The status endpoint at http://127.0.0.1:6690/status-json.xsl has not answered for ten minutes, so every listener is disconnected. radio-health restarts icecast after three consecutive bad checks (fifteen minutes); if this alert is firing the automatic repair did not work. Check `sudo herd status icecast` and the tail of /var/log/wolk-jjba/icecast.log."

      - uid: radio-source-missing
        title: "Radio mount has no source: {{ $labels.mount }}"
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "wolk_radio_source_connected == 0"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Nothing is pushing /{{ $labels.mount }}"
          description: "Icecast is up but the mount /{{ $labels.mount }} has no source: MPD is not encoding into it. The other mounts may still be playing, so this is a partial outage - one client profile (for example the mobile one) is dead while the rest works. Check `sudo herd status mpd` and /var/log/wolk-jjba/mpd.log; the usual causes are a lost Icecast connection on that output and a shout password that no longer matches."

      - uid: radio-mpd-down
        title: MPD is not answering
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "wolk_mpd_up"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "MPD is not listening on 6600"
          description: "The radio has no encoder. radio-health restarts MPD too, so a firing alert means the restart did not help: look at /var/log/wolk-jjba/mpd.log for a configuration or library error (`sudo herd status mpd`)."

      - uid: radio-library-unmounted
        title: Music library is not mounted
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "wolk_radio_library_mounted"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "/mnt/wolkenschlosslagerung is not mounted"
          description: "MPD's music lives on the Hetzner Storage Box over CIFS and the mount is gone, so playback cannot read a single file - the stream stalls on the current track and then stops. Nothing restarts automatically for this one on purpose: the radio comes back by itself when the mount does. Check `findmnt /mnt/wolkenschlosslagerung` and that the box answers (`ping u600604.your-storagebox.de`), then `sudo herd restart file-system-/mnt/wolkenschlosslagerung`."

      - uid: radio-library-empty
        title: MPD database is empty
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "wolk_mpd_songs"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "MPD has no songs in its database"
          description: "The library database at /var/lib/mpd/tag_cache is empty even though the mount is there. radio-health runs `mpc update` when it sees this, and so does the nightly mpd-scan, so a firing alert means the scan itself is failing - usually the mount is up but its contents are missing, which is what a Storage Box without the music/ directory looks like."

      - uid: radio-silent
        title: Radio has been paused for hours
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "wolk_mpd_playing"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "The radio has been silent for six hours"
          description: "MPD is up but nothing has been played for six hours: the stream is up and silent on all mounts. That is either deliberate - a pause or a stop that was left on, which radio-health now leaves alone - or playback stopped on a file it could not decode. `mpc status` says which, and `mpc play` puts the radio back on."

      - uid: radio-metrics-stale
        title: Radio metrics are stale
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "time() - wolk_radio_check_timestamp_seconds"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1200
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The radio check has not run for twenty minutes"
          description: "radio-health writes /var/lib/prometheus/node-exporter/wolk_radio.prom every five minutes. That file is missing or old, which means the job, node exporter or the textfile directory is broken - and while it is broken, none of the other radio alerts can fire. Check `sudo herd status radio-health` and the tail of /var/log/wolk-jjba/radio-health.log."
