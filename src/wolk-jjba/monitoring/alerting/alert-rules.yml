                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'absent(loki_source_file_file_bytes_total{path="/var/log/wolk-jjba/byggsteg-daemon.log"}) and on() (up{job="alloy"} == 1)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: critical
          daemon: byggsteg-daemon
        annotations:
          summary: "Alloy is not tailing byggsteg-daemon's log"
          description: "The file /var/log/wolk-jjba/byggsteg-daemon.log is not among Alloy's tailed files. The file was deleted, became unreadable, or the daemon stopped writing to it."

