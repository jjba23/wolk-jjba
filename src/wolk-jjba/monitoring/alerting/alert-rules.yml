          description: "gfs-backup runs every night at 02:45 and promotes one archive per week and one per month into wolk-jjba-backups/archive/ on the Storage Box, then prunes that tree. It has not reported a success for more than three days, so no new weekly or monthly archive exists and the pruned tree is not shrinking either. Check `sudo herd status gfs-backup` and /var/log/wolk-jjba/gfs-backup.log, then run `maak gfs-backup` (a dry run) by hand as backer-upper."

      - uid: long-term-archive-missing
