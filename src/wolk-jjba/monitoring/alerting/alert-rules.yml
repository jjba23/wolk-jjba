        labels:
          severity: critical
        annotations:
          summary: "No new {{ $labels.project }} backup for over 26 hours"
          description: "The newest {{ $labels.project }} archive is older than 26 hours, which is one missed run of its twice-daily timer (a project with no archive at all reports age = time since the epoch, so it fires too). Check `sudo herd status backup-{{ $labels.project }}` and the tail of /var/log/wolk-jjba/backup-{{ $labels.project }}.log: a full disk, a database that failed its PRAGMA quick_check, and a wrong path all end here."

      - uid: backup-verified-stale
