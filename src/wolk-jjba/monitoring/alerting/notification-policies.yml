apiVersion: 1

policies:
  - orgId: 1
    receiver: wolk-jjba email
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Critical alerts (crashes, lost log streams, monitoring down) are
      # sent sooner and repeated more often than warnings.
      - receiver: wolk-jjba email
        object_matchers:
          - [severity, "=", critical]
        group_wait: 10s
        group_interval: 2m
        repeat_interval: 1h
